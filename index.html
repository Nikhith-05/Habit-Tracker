<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task Tracker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Task Tracker">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icon-192.png">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <img src="icon-192.png" alt="logo" class="logo" width="36" height="36">
            <h1>Daily Task Tracker</h1>
        </div>
        <div class="header-actions">
            <button id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
        </div>
    </header>
    
    <div class="install-prompt" id="install-prompt">
        <p>Add this app to your home screen for quick access!</p>
        <button id="install-btn">Add to Home Screen</button>
        <button id="dismiss-btn">Dismiss</button>
    </div>
    
    <div class="form-container">
        <h2>Add New Challenge</h2>
        <form id="challenge-form">
            <div class="form-group">
                <label for="task-name">Task Name:</label>
                <input type="text" id="task-name" required>
            </div>
            <div class="form-group">
                <label for="num-days">Number of Days:</label>
                <input type="number" id="num-days" min="1" max="365" required>
            </div>
            <div class="form-group">
                <label for="start-date">Start Date:</label>
                <input type="date" id="start-date" required>
            </div>
            <button type="submit">Add Challenge</button>
            <button type="button" id="update-btn" style="display: none;">Update Challenge</button>
            <button type="button" id="cancel-btn" style="display: none;">Cancel</button>
        </form>
    </div>
    
    <div class="dashboard">
        <div class="summary" id="summary"></div>
        <div id="challenges-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
